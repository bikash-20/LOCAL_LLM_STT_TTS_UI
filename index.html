    <link rel="apple-touch-icon" sizes="152x152" href="/apple-touch-icon-152x152.png" />

    <!-- KaTeX CSS for LaTeX Math rendering -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/katex.min.css" integrity="sha384-zh0Wpnj4f0g03U1jB3hA0m3u4A1qDkL3mK0k8r1nZ8f5p8/z0q6n3f2p1q0r8u7y" crossorigin="anonymous">
    
    <!-- Early PWA Install Prompt Capture -->
    <script>
      window.__deferredPrompt = null;
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        window.__deferredPrompt = e;
        window.dispatchEvent(new CustomEvent('pwa-prompt-ready'));
      });
      window.addEventListener('appinstalled', () => {
        window.__deferredPrompt = null;
        window.dispatchEvent(new CustomEvent('pwa-installed'));
      });
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js').catch(err => console.error('SW registration error:', err));
      }
    </script>
    
    <!-- Premium Eye-Catching Fonts: Plus Jakarta Sans (Crisp Modern UI), Playfair Display (Luxury Editorial), Outfit, Urbanist & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
